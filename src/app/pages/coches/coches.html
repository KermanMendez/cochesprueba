

<div class="coches-layout">
    <aside class="coches-menu">
        <label for="categoria-select">{{ 'CATEGORY' | translate }}:</label>
        <select id="categoria-select" #categoria (change)="getCochesByType(categoria.value)">
            <option value="">{{ 'TODAS' | translate }}</option>
            <option value="SUV">{{ 'CATEGORYSUV' | translate }}</option>
            <option value="SEDAN">{{ 'CATEGORYSEDAN' | translate }}</option>
            <option value="HATCHBACK">{{ 'CATEGORYHATCHBACK' | translate }}</option>
            <option value="DEPORTIVO">{{ 'CATEGORYSPORT' | translate }}</option>
            <option value="ELECTRICO">{{ 'CATEGORYELECTRIC' | translate }}</option>
            <option value="DIESEL">{{ 'CATEGORYDIESEL' | translate }}</option>
            <option value="HIBRIDO">{{ 'CATEGORYHYBRID' | translate }}</option>

        </select>
        <label for="marca-select">{{ 'BRAND' | translate }}:</label>
        <select id="marca-select" #marca (change)="getCochesByMarca(marca.value)">
            <option value="">{{ 'TODAS' | translate }}</option>
            <option value="Toyota">Toyota</option>
            <option value="Ford">Ford</option>
            <option value="BMW">BMW</option>
            <option value="Audi">Audi</option>
            <option value="Honda">Honda</option>
            <option value="Chevrolet">Chevrolet</option>
            <option value="Nissan">Nissan</option>
        </select>
        <button class="menu-btn" (click)="getFeaturedCoches()">{{ 'FEATURED' | translate }}</button>
    </aside>
    <main class="coches-main">
        <h2 class="coches-header">{{ 'SELECTION' | translate }}</h2>
        @if (coches.length > 0) {
            <div class="coches-grid">
                @for (coche of coches; track coche.id) {
                    <div class="coche-item" [routerLink]="['/detalle', coche.id]">
                        <img class="coche-foto" [src]="coche.fotoURL || 'https://via.placeholder.com/320x180?text=Sin+Foto'" [alt]="coche.marca + ' ' + coche.modelo" />
                        <div class="coche-info">
                            <div class="coche-marca">{{ coche.marca }}</div>
                            <div class="coche-modelo">{{ coche.modelo }}</div>
                            <div class="coche-tipo">
                                @for (tipo of coche.tipo; track tipo; let last = $last) {
                                    <span>{{ tipo }}</span>@if (!last) {, }
                                }
                            </div>
                        </div>
                    </div>
                }
            </div>
        } @else {
            <div>{{ 'NODISPONIBLES' | translate }}</div>
        }
    </main>
</div>
